# SPDX-License-Identifier: AGPL-3.0-or-later
name: CI

# Cinco alvos distintos, por ordem do lider (GODS_LAWS.md, L-10):
# Fedora 44 (primario, pinado -- e a maquina dele, o CI tem de falhar
# quando a maquina dele falharia), Ubuntu, Arch, CachyOS (imagem OFICIAL
# deles, cachyos/cachyos -- NAO e Arch renomeado, toolchain e repositorio
# proprios, verde no job Arch nunca autoriza declarar CachyOS suportado)
# e Windows.
#
# ESTADO ATUAL (22/08/2026, GODS_LAWS.md L-11): este repositorio ainda NAO
# tem codigo de aplicacao -- o GlintFx (unica base permitida por L-01) foi
# reiniciado do zero no mesmo dia e ainda nao expoe janela nem desenho.
# Os jobs de build abaixo por isso nao compilam nada: eles prontificam a
# toolchain e o padrao C++23 (prova real, nao so `--version`) e, na
# ausencia de CMakeLists.txt, DECLARAM ISSO EXPLICITAMENTE em vez de
# fingir sucesso silencioso. Os jobs "leis" e "portoes-autoteste" existem
# HOJE precisamente para o caso "portao que varre zero arquivos e diz
# verde" (GODS_LAWS.md L-09). Refinamento decidido pelo lider em
# 22/08/2026: enquanto NENHUMA das pastas de camada existir, o portao sai
# VERDE declarando "NADA A VERIFICAR" -- e proibido de imprimir OK ou
# limpo, porque isso afirmaria verificacao que nao houve. No instante em
# que qualquer uma das tres pastas aparecer, varrer zero volta a ser
# FALHA. A trava fecha sozinha e e exercitada pelo job de autoteste.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    container: ${{ matrix.imagem }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: Fedora 44 (primario)
            cc: c++
            imagem: fedora:44
            instalar: >-
              dnf -y install gcc-c++ cmake ninja-build pkgconf-pkg-config git
          - nome: Ubuntu
            imagem: ubuntu:24.04
            # g++ padrao do 24.04 (13.3) da C++23 parcial. Piso do
            # ecossistema (GlintFx) e GCC 14 -- mesma escolha aqui, para o
            # dia em que este repo tambem compilar contra o GlintFx.
            cc: g++-14
            instalar: >-
              apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
              g++-14 cmake ninja-build pkg-config git ca-certificates
          - nome: Arch
            cc: c++
            imagem: archlinux:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
          - nome: CachyOS
            # Imagem oficial da CachyOS (nao Arch renomeado -- GODS_LAWS.md
            # L-10). Mesma imagem ja em uso no GlintFx.
            cc: c++
            imagem: cachyos/cachyos:latest
            instalar: >-
              pacman -Syu --noconfirm gcc cmake ninja pkgconf git
    steps:
      - name: Instalar toolchain
        run: ${{ matrix.instalar }}

      - uses: actions/checkout@v4

      - name: Versoes da toolchain
        run: |
          set -eux
          ${{ matrix.cc }} --version
          cmake --version
          ninja --version

      # Compila um fragmento minimo para PROVAR o padrao (nao so ler a
      # versao impressa pelo compilador) -- mesmo teste que o GlintFx roda.
      - name: Padrao C++23 aceito
        run: |
          set -eux
          cat > /tmp/c23.cpp <<'CPP'
          #include <cstdio>
          constexpr int f() { if consteval { return 23; } else { return 0; } }
          int main() { static_assert(f() == 23); std::printf("c++%ld\n", __cplusplus); }
          CPP
          ${{ matrix.cc }} -std=c++23 -o /tmp/c23 /tmp/c23.cpp
          /tmp/c23

      # GODS_LAWS.md L-09: nao finge que buildou. Se nao ha CMakeLists.txt
      # ainda (L-11, projeto do zero), declara isso e sai 0 -- e uma
      # ausencia REAL de alvo de build, nao um portao de verificacao que
      # "olhou e nao achou nada" (esses dois casos, ver job "leis", tem de
      # FALHAR; um build inexistente e diferente: nao ha o que compilar,
      # e dizer isso em voz alta nao e mentira).
      - name: Build e testes (quando existir CMakeLists.txt)
        run: |
          set -eux
          if [ ! -f CMakeLists.txt ]; then
            echo "AVISO: sem CMakeLists.txt neste commit -- nada para compilar ainda (GODS_LAWS.md L-11). Build pulado, declarado explicitamente."
            exit 0
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cc }} -DMAPEDITOR_WERROR=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versoes da toolchain
        shell: pwsh
        run: cmake --version

      # Sem action de terceiro: o proprio CMake localiza o MSVC (mesmo
      # padrao do GlintFx).
      - name: Padrao C++23 aceito
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path probe | Out-Null
          @'
          #include <cstdio>
          constexpr int f() { if consteval { return 23; } else { return 0; } }
          int main() { static_assert(f() == 23); std::printf("ok\n"); }
          '@ | Set-Content probe/main.cpp
          @'
          cmake_minimum_required(VERSION 3.25)
          project(probe CXX)
          set(CMAKE_CXX_STANDARD 23)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          add_executable(probe main.cpp)
          '@ | Set-Content probe/CMakeLists.txt
          cmake -S probe -B probe/build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build probe/build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Get-ChildItem -Recurse -Filter probe.exe probe/build)[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force probe

      # Mesma logica do job linux: sem CMakeLists.txt do PROJETO, declara
      # e sai 0, em vez de fingir build verde.
      - name: Build e testes (quando existir CMakeLists.txt)
        shell: pwsh
        run: |
          if (-not (Test-Path "CMakeLists.txt")) {
            Write-Host "AVISO: sem CMakeLists.txt neste commit -- nada para compilar ainda (GODS_LAWS.md L-11). Build pulado, declarado explicitamente."
            exit 0
          }
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DMAPEDITOR_WERROR=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # ---------------------------------------------------------------------
  # Portoes de arquitetura/dependencia (GODS_LAWS.md L-12 e L-01).
  # Estatico, sobre texto -- roda uma vez, nao precisa dos cinco alvos.
  # HOJE ESTE JOB SAI VERDE declarando NADA A VERIFICAR, porque nenhuma
  # das pastas domain/application/platform existe ainda. Assim que uma
  # delas aparecer, varrer zero arquivos volta a ser FALHA (a trava da
  # GODS_LAWS.md L-09, decidida pelo lider em 22/08/2026).
  # ---------------------------------------------------------------------
  leis:
    name: Portoes de camada e dependencia (L-12, L-01)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Portao de camadas (domain / application / platform -- L-12)
        run: python3 tools/ci/check_layers.py .

      - name: Portao de dependencia permitida (lista do permitido -- L-01)
        run: python3 tools/ci/check_allowed_includes.py .

  # ---------------------------------------------------------------------
  # Autoteste dos DOIS portoes acima, com os TRES controles exigidos
  # (positivo, negativo, vazio e TRAVA -- GODS_LAWS.md L-09). Roda sobre
  # fixtures sinteticas em diretorio temporario, nao sobre este
  # repositorio: um valida o PORTAO, o outro valida o ESTADO ATUAL DO
  # REPO. O quarto controle prova as duas direcoes da trava: sem pasta e
  # zero arquivos sai 0; com pasta existindo (vazia, ou so com arquivo
  # que nao casa a extensao) e zero arquivos sai 1.
  # ---------------------------------------------------------------------
  portoes-autoteste:
    name: Autoteste dos portoes (3 controles -- L-09)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Autoteste -- portao de camadas
        run: python3 tools/ci/selftest_check_layers.py

      - name: Autoteste -- portao de dependencia permitida
        run: python3 tools/ci/selftest_check_allowed_includes.py

      - name: Autoteste -- medidor de hotspots (restricao "nunca bloqueia", L-19)
        run: python3 tools/ci/selftest_measure_hotspots.py

  # ---------------------------------------------------------------------
  # MEDIDOR informativo de L-19 (GODS_LAWS.md), decisao do lider depois do
  # CTO propor um numero em vez da regra qualitativa. ISTO NAO E UM PORTAO:
  # nao pode reprovar o CI em circunstancia nenhuma -- zero limite, zero
  # numero magico, zero comparacao com teto, so imprime. Roda uma vez (e
  # analise estatica de texto + `git log`, nao precisa dos cinco alvos da
  # L-10). `continue-on-error: true` no step e cinto-e-suspensorio alem da
  # garantia do proprio script (que ja sai 0 sempre): mesmo se o ambiente
  # falhar de um jeito que o script nao previu (python3 ausente, etc.),
  # este job nunca deixa o workflow vermelho.
  #
  # fetch-depth 0 (mesmo padrao do job "secrets" abaixo): a segunda lista
  # do medidor (frequencia nos ultimos N commits) depende de historico, e
  # o padrao raso do Actions (fetch-depth 1) a deixaria sem o que contar.
  # Se mesmo assim vier raso (ex.: workflow_dispatch com configuracao
  # diferente), o proprio script DETECTA e DECLARA -- nunca imprime lista
  # vazia como se fosse "ninguem tocou em nada" (GODS_LAWS.md L-09, mesmo
  # espirito aplicado a um medidor que nao e portao).
  # ---------------------------------------------------------------------
  hotspots-informativo:
    name: Medidor de hotspots (informativo, L-19 -- NUNCA bloqueia o CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Medidor de hotspots (tamanho + frequencia -- so imprime)
        continue-on-error: true
        run: python3 tools/ci/measure_hotspots.py . --commits 20

  # ---------------------------------------------------------------------
  # gitleaks -- secrets no historico completo. Mesmo padrao do GlintFx e
  # do restante do ecossistema (transcritor, tab_pendencias): fetch-depth
  # 0 porque o gate real e o historico inteiro, nao so o working tree
  # (pega segredo commitado e depois removido). Binario baixado do
  # tarball de release pinado e verificado por checksum, nao curl|sh.
  #
  # Download com REPETICAO (tools/ci/download_with_retry.py), depois de
  # falha real medida em 23/08/2026: "curl: (35) Recv failure: Connection
  # reset by peer" ao baixar o binario -- rede transitoria, nao vazamento
  # e nao defeito de codigo; reexecutar o job resolveu na hora. Pela
  # GODS_LAWS.md L-17, portao vermelho bloqueia o push seguinte, entao uma
  # conexao resetada nao pode continuar derrubando o job por um motivo
  # que nao tem nada a ver com o codigo -- e o habito de reexecutar
  # vermelho sem ler e exatamente o que a L-09 existe para combater.
  #
  # A verificacao de checksum CONTINUA obrigatoria e CONTINUA podendo
  # falhar o job: ontem ela estava CERTA em recusar seguir (nao conseguiu
  # conferir o binario e parou, em vez de instalar assim mesmo). Isto nao
  # foi relaxado.
  #
  # Os logs abaixo distinguem, com prefixo inequivoco, as tres causas
  # possiveis de vermelho neste job -- que sao situacoes DIFERENTES e nao
  # podem parecer a mesma coisa para quem le o resumo:
  #   REDE      -- falha transitoria de rede, foi repetida, so falha o job
  #                se esgotar as tentativas.
  #   CHECKSUM  -- binario baixado nao confere com o checksum publicado;
  #                falha REAL, nunca repetida, nunca instalada assim mesmo.
  #   ACHADO    -- gitleaks encontrou segredo no historico; falha REAL.
  # ---------------------------------------------------------------------
  secrets:
    name: gitleaks (secrets no historico)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar gitleaks (binario pinado, verificado, download com repeticao)
        run: |
          set -euo pipefail

          echo "::group::Download (rede, com repeticao -- ver tools/ci/download_with_retry.py)"
          python3 tools/ci/download_with_retry.py \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            "/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          python3 tools/ci/download_with_retry.py \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" \
            "/tmp/gitleaks_checksums.txt"
          echo "::endgroup::"

          echo "::group::Verificacao de checksum (falha aqui e REAL -- nunca repetida, nunca ignorada)"
          if grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" /tmp/gitleaks_checksums.txt \
              | (cd /tmp && sha256sum -c -); then
            echo "CHECKSUM: OK, binario confere com o publicado na release."
          else
            echo "::error::CHECKSUM (real, binario NAO confere com o publicado na release -- isto NAO e falha de rede, nao foi repetido de proposito): nao instalar, nao reexecutar sem investigar." >&2
            exit 1
          fi
          echo "::endgroup::"

          sudo tar -xzf "/tmp/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -C /usr/bin gitleaks
          sudo chmod 0755 /usr/bin/gitleaks
          gitleaks version

      # .gitleaksignore na raiz documenta o unico falso-positivo conhecido
      # (CONTRACT.md, exemplo didatico "INCORRECT -- NEVER commit this").
      # Se este step falhar com QUALQUER outro achado, e um segredo real:
      # nao editar o .gitleaksignore para faze-lo passar sem antes provar,
      # igual foi feito com o achado atual, que o valor e ficticio.
      - name: gitleaks -- historico completo
        run: |
          set -euo pipefail
          echo "::group::gitleaks detect (achado aqui e REAL -- segredo no historico, nao rede nem checksum)"
          if gitleaks detect --source . --redact --no-banner --verbose --exit-code 1; then
            echo "::endgroup::"
          else
            echo "::endgroup::"
            echo "::error::ACHADO (real, gitleaks): segredo encontrado no historico do repositorio -- isto NAO e falha de rede nem de checksum. Nao reexecutar sem investigar; revise o output acima e o .gitleaksignore." >&2
            exit 1
          fi
